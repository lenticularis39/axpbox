// Configuration for the serial-console reconnect test.
//
// Deliberately minimal: no disks and no network.  The subject is the TCP serial
// console (CSerial), and the test hammers it -- repeated connects, abrupt
// closes with output still pending, descriptor starvation -- so it must not be
// able to touch anything a user cares about.  The guest sits at the SRM prompt,
// which is enough: CSerial is the same object whether the guest is running SRM,
// an operating system, or nothing at all.
//
// pci0.7 = ali is required even though nothing here uses the southbridge.
// CSerial::eval_interrupts() calls theAli->pic_set_line() unconditionally, and
// theAli is only assigned by CAliM1543C::init(), so a config with no ALI device
// segfaults the first time the guest touches the UART.

sys0 = tsunami
{
  memory.bits = 26;
  rom.srm = "cl67srmrom.exe";
  rom.decompressed = "decompressed.rom";
  rom.flash = "flash.rom";

  cpu0 = ev68cb
  {
    speed = 800M;
    skip_memtest_hack = true;
  }

  // Not 21000: a machine running this test may well have another instance
  // alive on the default port.
  serial0 = serial
  {
    address = "127.0.0.1";
    port = 21003;
  }

  pci0.7 = ali
  {
  }
}
